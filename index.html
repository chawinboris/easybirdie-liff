<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>จอง Bay - Golf Simulator</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Sarabun", sans-serif;
    background: #0f2418;
    color: #fff;
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #9fd8b8; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #163a26;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 14px; margin: 10px 0 6px; color: #cdeedd; }
  select, input[type=date], input[type=text], input[type=tel] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #2c5c40;
    background: #0f2418;
    color: #fff;
    font-size: 15px;
  }
  .bay-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 2px solid #2c5c40;
    background: #0f2418;
    color: #fff;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .bay-btn.selected { border-color: #4ade80; background: #1c4a2e; }
  .bay-btn .price { color: #9fd8b8; font-size: 13px; margin-top: 4px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .booked-list { font-size: 13px; color: #ffb4b4; margin-top: 8px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checkbox-row input { width: 18px; height: 18px; }
  .pay-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 2px solid #2c5c40;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .pay-option.selected { border-color: #4ade80; background: #1c4a2e; }
  .summary-line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .summary-total { font-size: 20px; font-weight: bold; color: #4ade80; text-align: right; margin-top: 8px; }
  button.submit {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: #4ade80;
    color: #0f2418;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  button.submit:disabled { background: #375; color: #9fd8b8; }
  .msg { padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 14px; }
  .msg.error { background: #4a1c1c; color: #ffb4b4; }
  .msg.success { background: #1c4a2e; color: #baffd6; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>⛳ จองใช้งาน Bay</h1>
<div class="sub">เลือก Bay ที่ต้องการ แล้วกรอกรายละเอียดการจอง</div>

<!-- ================= STEP A: เลือก Bay ================= -->
<div class="card" id="bayCard">
  <label>เลือก Bay</label>
  <div id="bayList">กำลังโหลด...</div>
</div>

<!-- ================= STEP B: วันเวลา ================= -->
<div class="card" id="timeCard">
  <label>วันที่ต้องการจอง</label>
  <input type="date" id="bookingDate" />

  <div class="row">
    <div>
      <label>เวลาเริ่ม</label>
      <select id="startTime"></select>
    </div>
    <div>
      <label>จำนวนชั่วโมง</label>
      <select id="duration">
        <option value="1">1 ชั่วโมง</option>
        <option value="2">2 ชั่วโมง</option>
        <option value="3">3 ชั่วโมง</option>
        <option value="4">4 ชั่วโมง</option>
      </select>
    </div>
  </div>
  <div class="booked-list" id="bookedList"></div>
</div>

<!-- ================= STEP C: ข้อมูลลูกค้า ================= -->
<div class="card" id="customerCard">
  <label>ชื่อ-นามสกุล</label>
  <input type="text" id="customerName" placeholder="ชื่อลูกค้า" />

  <label>เบอร์โทรศัพท์</label>
  <input type="tel" id="phone" placeholder="08xxxxxxxx" />

  <div class="checkbox-row">
    <input type="checkbox" id="isMember" />
    <label style="margin:0;">ฉันเป็น Member / นักเรียนคอร์ส</label>
  </div>

  <div id="memberIdBox" class="hidden">
    <label>เลขสมาชิก (Member ID)</label>
    <input type="text" id="memberId" placeholder="เช่น M0001" />
  </div>
</div>

<!-- ================= STEP D: วิธีชำระเงิน ================= -->
<div class="card" id="paymentCard">
  <label>วิธีการชำระเงิน</label>
  <div class="pay-option" id="payQR" data-val="QR">
    <span>💳</span><span>QR Code Payment</span>
  </div>
  <div class="pay-option" id="payCash" data-val="CASH">
    <span>💵</span><span>Cash / ชำระที่หน้าร้าน</span>
  </div>
</div>

<!-- ================= STEP E: สรุปราคา ================= -->
<div class="card" id="summaryCard">
  <div class="summary-line"><span>Bay</span><span id="sumBay">-</span></div>
  <div class="summary-line"><span>วันเวลา</span><span id="sumTime">-</span></div>
  <div class="summary-line"><span>ราคา/ชม.</span><span id="sumRate">-</span></div>
  <div class="summary-total" id="sumTotal">รวม 0 บาท</div>
</div>

<button class="submit" id="submitBtn">ยืนยันการจอง</button>
<div id="resultMsg"></div>

<script>
// ⚠️ ใส่ Web App URL ของคุณตรงนี้ (ได้จาก Step 2)
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzcd6oGHZdswSjy9hhjhDo6twZKjCWCFeGG969Hml9Y9CkQDN5AE7cDBRCHcd2kRmSGpQ/exec";

// ⚠️ ใส่ LIFF ID ตรงนี้ (จะได้ใน Step 4 - ตอนนี้ใส่ค่าว่างไว้ก่อนได้)
const LIFF_ID = "YOUR_LIFF_ID_HERE";

let bays = [];
let selectedBay = null;
let selectedPayment = null;
let lineUserId = "guest-test-user"; // ค่า default ตอนทดสอบนอก LINE
let lineDisplayName = "";

// ---------- INIT ----------
window.onload = async () => {
  try {
    if (LIFF_ID !== "YOUR_LIFF_ID_HERE") {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        lineUserId = profile.userId;
        lineDisplayName = profile.displayName;
        document.getElementById("customerName").value = lineDisplayName;
      } else {
        liff.login();
      }
    }
  } catch (err) {
    console.log("LIFF init skipped/failed (ok ถ้ากำลังทดสอบนอกแอป LINE):", err);
  }

  buildTimeOptions();
  await loadBays();
  document.getElementById("bookingDate").valueAsDate = new Date();
  await loadBookedSlots();
};

function buildTimeOptions() {
  const select = document.getElementById("startTime");
  for (let h = 10; h <= 22; h++) {
    const label = String(h).padStart(2, "0") + ":00";
    const opt = document.createElement("option");
    opt.value = label;
    opt.textContent = label;
    select.appendChild(opt);
  }
}

// ---------- โหลดรายชื่อ Bay ----------
async function loadBays() {
  const res = await fetch(WEBAPP_URL + "?action=getBays");
  bays = await res.json();
  const list = document.getElementById("bayList");
  list.innerHTML = "";
  bays.forEach(bay => {
    const btn = document.createElement("div");
    btn.className = "bay-btn";
    btn.innerHTML = `<div>${bay.bay_name}</div>
      <div class="price">บุคคลทั่วไป ${bay.price_regular} บาท/ชม. · Member ${bay.price_member} บาท/ชม.</div>`;
    btn.onclick = () => selectBay(bay, btn);
    list.appendChild(btn);
  });
}

function selectBay(bay, el) {
  selectedBay = bay;
  document.querySelectorAll(".bay-btn").forEach(b => b.classList.remove("selected"));
  el.classList.add("selected");
  loadBookedSlots();
  updateSummary();
}

// ---------- โหลดช่วงเวลาที่ถูกจองแล้ว ----------
async function loadBookedSlots() {
  const box = document.getElementById("bookedList");
  if (!selectedBay) { box.textContent = ""; return; }
  const date = document.getElementById("bookingDate").value;
  const res = await fetch(
    `${WEBAPP_URL}?action=getBookedSlots&bayId=${selectedBay.bay_id}&date=${date}`
  );
  const slots = await res.json();
  if (Array.isArray(slots) && slots.length > 0) {
    box.textContent = "ไม่ว่าง: " + slots.map(s => `${s.start}-${s.end}`).join(", ");
  } else {
    box.textContent = "วันนี้ยังว่างทุกช่วงเวลา ✅";
    box.style.color = "#9fd8b8";
  }
}

document.getElementById("bookingDate").addEventListener("change", () => {
  loadBookedSlots();
  updateSummary();
});
document.getElementById("startTime").addEventListener("change", updateSummary);
document.getElementById("duration").addEventListener("change", updateSummary);

// ---------- Member checkbox ----------
document.getElementById("isMember").addEventListener("change", e => {
  document.getElementById("memberIdBox").classList.toggle("hidden", !e.target.checked);
  updateSummary();
});

// ---------- วิธีชำระเงิน ----------
document.getElementById("payQR").onclick = () => selectPayment("QR");
document.getElementById("payCash").onclick = () => selectPayment("CASH");
function selectPayment(val) {
  selectedPayment = val;
  document.getElementById("payQR").classList.toggle("selected", val === "QR");
  document.getElementById("payCash").classList.toggle("selected", val === "CASH");
}

// ---------- อัพเดทสรุปราคา (ราคาโดยประมาณ ราคาจริงยืนยันตอนบันทึก) ----------
function updateSummary() {
  if (!selectedBay) return;
  const isMember = document.getElementById("isMember").checked;
  const rate = isMember ? Number(selectedBay.price_member) : Number(selectedBay.price_regular);
  const hours = Number(document.getElementById("duration").value);
  const start = document.getElementById("startTime").value;
  const date = document.getElementById("bookingDate").value;

  document.getElementById("sumBay").textContent = selectedBay.bay_name;
  document.getElementById("sumTime").textContent = `${date} เวลา ${start} (${hours} ชม.)`;
  document.getElementById("sumRate").textContent = `${rate} บาท/ชม.`;
  document.getElementById("sumTotal").textContent = `รวม ${rate * hours} บาท`;
}

// ---------- ยืนยันการจอง ----------
document.getElementById("submitBtn").onclick = async () => {
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const isMember = document.getElementById("isMember").checked;
  const memberId = document.getElementById("memberId").value.trim();
  const date = document.getElementById("bookingDate").value;
  const startTime = document.getElementById("startTime").value;
  const hours = Number(document.getElementById("duration").value);
  const endHour = (Number(startTime.split(":")[0]) + hours).toString().padStart(2, "0");
  const endTime = endHour + ":00";

  const resultBox = document.getElementById("resultMsg");
  resultBox.innerHTML = "";

  if (!selectedBay) return showMsg("กรุณาเลือก Bay ก่อนครับ", "error");
  if (!name || !phone) return showMsg("กรุณากรอกชื่อและเบอร์โทรศัพท์", "error");
  if (isMember && !memberId) return showMsg("กรุณากรอกเลขสมาชิก", "error");
  if (!selectedPayment) return showMsg("กรุณาเลือกวิธีชำระเงิน", "error");

  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "กำลังบันทึก...";

  const payload = {
    action: "createBooking",
    data: {
      lineUserId, customerName: name, phone,
      bayId: selectedBay.bay_id,
      bookingDate: date, startTime, endTime,
      isMember, memberId, paymentMethod: selectedPayment
    }
  };

  try {
    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // กัน CORS preflight ปัญหา
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (result.success) {
      showMsg(
        `✅ จองสำเร็จ! เลขที่จอง ${result.bookingId} — ${result.bayName} รวม ${result.totalPrice} บาท`,
        "success"
      );
    } else {
      showMsg("❌ " + result.message, "error");
    }
  } catch (err) {
    showMsg("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message, "error");
  }

  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").textContent = "ยืนยันการจอง";
};

function showMsg(text, type) {
  document.getElementById("resultMsg").innerHTML =
    `<div class="msg ${type}">${text}</div>`;
}
</script>
</body>
</html>
