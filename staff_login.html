<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EasyBirdie Club — Staff Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1410; --panel: #10201a; --panel-border: #23392c;
    --gold: #c9a24b; --gold-light: #e6cd8f; --ivory: #f2ede1; --muted: #8ea08e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Jost', sans-serif; background: var(--bg); color: var(--ivory);
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(circle at 50% -10%, rgba(201,162,75,0.10), transparent 55%);
    padding: 20px;
  }
  .box { text-align: center; max-width: 320px; width: 100%; }
  .brand-eyebrow {
    font-size: 11px; letter-spacing: 5px; color: var(--gold); text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;
  }
  .brand-eyebrow::before, .brand-eyebrow::after {
    content: ""; height: 1px; width: 24px;
    background: linear-gradient(to var(--dir,right), transparent, var(--gold));
  }
  .brand-eyebrow::after { --dir: left; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px; color: var(--gold-light); margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 26px; }
  input {
    width: 100%; padding: 16px; text-align: center; letter-spacing: 8px; font-size: 22px;
    border-radius: 10px; border: 1px solid var(--panel-border); background: var(--panel); color: var(--ivory);
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%; margin-top: 16px; padding: 14px; border-radius: 10px; border: 1px solid var(--gold);
    background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: #1a1408;
    font-weight: 600; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; font-size: 13px;
  }
  #pinError { color: #ffb4a8; font-size: 13px; margin-top: 14px; display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="brand-eyebrow">EasyBirdie Club</div>
  <h1>Staff Login</h1>
  <div class="sub">กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน Dashboard</div>
  <input type="password" id="pinInput" maxlength="6" inputmode="numeric" placeholder="••••" autofocus />
  <button id="pinSubmit">เข้าสู่ระบบ</button>
  <div id="pinError">รหัสไม่ถูกต้อง กรุณาลองใหม่</div>
</div>

<script>
// ⚠️ ต้องตรงกับ STAFF_PIN ในไฟล์ staff_dashboard.html
const STAFF_PIN = "1234";

document.getElementById("pinSubmit").onclick = checkPin;
document.getElementById("pinInput").addEventListener("keypress", e => { if (e.key === "Enter") checkPin(); });

function checkPin() {
  const val = document.getElementById("pinInput").value;
  if (val === STAFF_PIN) {
    window.location.href = "staff_dashboard.html?pin=" + encodeURIComponent(val);
  } else {
    document.getElementById("pinError").style.display = "block";
  }
}
</script>
</body>
</html>
